# 1. SHARED CONFIGURATION (ConfigMap)

apiVersion: v1
kind: ConfigMap
metadata:
  name: sudoku-config
data:
  # Variables expected by the PostgreSQL image
  POSTGRES_USER: sudoku_user
  POSTGRES_DB: sudokudb
  
  # Variables expected by your Node.js backend
  DB_HOST: db
  DB_USER: sudoku_user
  DB_NAME: sudokudb
---

# 2 shared configuration (secret)
apiVersion: v1
kind: Secret
metadata:
  name: sudoku-secrets
type: Opaque
stringData:
  POSTGRES_PASSWORD: secretpassword
  DB_PASS: secretpassword
---

# 3. DATABASE TIER (StatefulSet)
apiVersion: v1
kind: Service
metadata:
  name: db
spec:
  selector:
    app: db
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
spec:
  serviceName: "db"
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
      - name: postgres
        image: postgres:15
        envFrom:
        - configMapRef:
             name: sudoku-config
        - secretRef:
            name: sudoku-secrets
        #  chking connection status it s equivalent to the one we use in mangodb
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "postgres"]
          initialDelaySeconds: 5
          periodSeconds: 10

        ports:
        - containerPort: 5432

        volumeMounts:
        - name: db-data
          mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
  - metadata:
      name: db-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 1Gi
---

# 4. BACKEND TIER (Deployment)
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: backend
  ports:
    - port: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:       
         app: backend
    spec:
      containers:
      - name: backend
        image: adam987456/qt-backend:latest
        imagePullPolicy: Always
        envFrom:
        - configMapRef:
            name: sudoku-config
        - secretRef:
            name: sudoku-secrets
        ports:
        - containerPort: 3000
---

# 5. FRONTEND TIER (Deployment)
apiVersion: v1
kind: Service
metadata:
  name: qt-sudoku
spec:
  type: LoadBalancer
  sessionAffinity: ClientIP
  selector:
    app: qt-sudoku
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qt-sudoku
spec:
  replicas: 3
  selector:
    matchLabels:
      app: qt-sudoku
  template:
    metadata:
      labels:
        app: qt-sudoku
    spec:
      containers:
      - name: qt-sudoku
        image: adam987456/qt-sudoku:latest
        imagePullPolicy: Always  
        ports:
        - containerPort: 8080
